<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f5fa" />
  <script>
    // Restore the saved theme before first paint to avoid a flash of the wrong mode.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || ((!stored || stored === "system") && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#0c0e17" : "#f4f5fa");
      } catch (e) {}
    })();
  </script>
  <meta
    name="description"
    content="Nexus OS — Your purchases, connected intelligently. Scan receipts, track warranties, protect what you own."
  />
  <title>Nexus OS — Your purchases. Connected intelligently.</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
